name: DART Financials

# Quarterly + annual earnings for the whole market.
#
# Runs daily, not weekly. The numbers themselves only move four times a
# year, but WHEN a company files is the thing we track, and filings land
# every business day through earnings season. The run is bulk now
# (fnlttMultiAcnt, 99 companies per call), so a daily pass is ~270 API
# calls and a couple of minutes.
#
# 15:00 UTC = 00:00 KST, clear of the disclosures (13:00 UTC) and
# mezzanine (19:00 UTC) jobs so the three don't share a DART quota spike.
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-financials
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Backstop only. The script holds its own, shorter budget
    # (FIN_BUDGET_MIN) and writes + commits what it has when that runs
    # out. The previous 30-minute timeout killed all 29 runs this
    # workflow ever had, each time skipping the commit step, so
    # data/financials.json was never produced at all.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch DART financials
        env:
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
          FIN_BUDGET_MIN: '25'
        run: python scripts/fetch_dart_financials.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/financials.json data/dart-corpcode.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            STAMP=$(date -u +"%Y-%m-%d")
            COVERED=$(python -c "import json; print(json.load(open('data/financials.json'))['covered'])")
            QTRS=$(python -c "import json; print(json.load(open('data/financials.json'))['withQuarters'])")
            PARTIAL=$(python -c "import json; r=(json.load(open('data/financials.json')).get('lastRun') or {}); print('' if r.get('complete', True) else ' (partial)')")
            git commit -m "📊 Financials ${STAMP} (${COVERED} tickers, ${QTRS} with quarters)${PARTIAL}"
            git push
          fi
