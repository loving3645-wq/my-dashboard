name: DART Recent Disclosures

# Disclosures come in throughout the day. Cron runs at 13:00 UTC =
# 22:00 KST — well after market close (15:30 KST) and after the bulk
# of evening 수시공시 are filed. Mon-Fri only.
on:
  schedule:
    - cron: '0 13 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-disclosures
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch recent disclosures
        env:
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
        run: python scripts/fetch_recent_disclosures.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/disclosures.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            STAMP=$(date -u +"%Y-%m-%d")
            COUNT=$(python -c "import json; print(json.load(open('data/disclosures.json'))['totalDisclosures'])")
            git commit -m "📑 Disclosures ${STAMP} (${COUNT} items)"
            git push
          fi
