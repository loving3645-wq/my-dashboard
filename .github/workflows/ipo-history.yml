name: Weekly IPO History

# IPOs don't happen every day — weekly is enough.
# Sun 09:00 UTC = Mon 06:00 KST (before the trading week starts).
on:
  schedule:
    - cron: '0 9 * * 0'
  workflow_dispatch:
  # paths-self trigger — main에 이 파일이 변경되어 머지될 때 1회 자동 실행
  # (data 부트스트랩 / 스크립트 변경 후 즉시 갱신용. cron까지 안 기다려도 됨)
  push:
    branches: [main]
    paths:
      - '.github/workflows/ipo-history.yml'
      - 'scripts/build_ipo_history.py'

permissions:
  contents: write

concurrency:
  group: ipo-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Build IPO history
        run: python scripts/build_ipo_history.py

      - name: Enrich with DART (Phase 2A)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -z "$DART_API_KEY" ]; then
            echo "DART_API_KEY not set — skipping DART enrichment"
            exit 0
          fi
          python scripts/build_ipo_lockup.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ipo-history.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            COUNT=$(python -c "import json; print(json.load(open('data/ipo-history.json'))['count'])")
            git commit -m "📈 IPO history $(date -u +%Y-%m-%d) (${COUNT} listings)"
            git push
          fi
