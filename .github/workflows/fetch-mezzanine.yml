name: DART Mezzanine

# Mezzanine (CB/BW/EB) issuance announcements appear ad-hoc, mostly for
# small caps. Weekly is enough — anything time-critical for a position
# would already trigger a manual run. Monday 19:00 UTC = Tuesday 04:00 KST.
on:
  schedule:
    - cron: '0 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-mezzanine
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch mezzanine history
        env:
          OPENDART_KEY: ${{ secrets.OPENDART_KEY }}
        run: python scripts/fetch_mezzanine_history.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/mezzanine.json
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit"
          else
            STAMP=$(date -u +"%Y-%m-%d")
            ISSUERS=$(python -c "import json; print(json.load(open('data/mezzanine.json'))['issuersWithMezzanine'])")
            ISS=$(python -c "import json; print(json.load(open('data/mezzanine.json'))['totalIssuances'])")
            git commit -m "💳 Mezzanine ${STAMP} (${ISSUERS} issuers, ${ISS} issuances)"
            git push
          fi
