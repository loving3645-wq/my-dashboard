<style>
  :root {

    --gold-bg: #f7eecf;
    --green: #4a7c4e;
    --green-bg: #e0ebd9;
    --blue: #3a5e7e;
    --blue-bg: #dde6ee;

  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body {

    background-attachment: fixed;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  .app { max-width: 1600px; margin: 0 auto; padding: 24px 28px 80px; }
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; gap: 16px; }
  .header-left h1 { font-family: var(--serif); font-weight: 400; font-size: 30px; letter-spacing: -0.02em; line-height: 1; }
  .header-left h1 em { font-style: italic; color: var(--accent); font-weight: 500; }
  .header-left .subtitle { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); letter-spacing: 0.1em; margin-top: 6px; text-transform: uppercase; }
  .header-right { display: flex; gap: 24px; align-items: center; }

  .toolbar { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }

  .filter-btn:hover { border-color: var(--line-strong); color: var(--ink); }

  .sync-pill { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; letter-spacing: 0.1em; padding: 4px 10px; }

  .sync-pill.live .dot { background: var(--green); box-shadow: 0 0 6px rgba(74,124,78,0.4); }

  .board { display: grid; grid-template-columns: 1.05fr 1fr 1fr 1fr; gap: 14px; }
  @media (max-width: 1100px) { .board { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr; }

  }
  .col { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; min-height: 70vh; max-height: 80vh; overflow: hidden; box-shadow: var(--shadow-sm); }
  .col.cal { background: var(--surface-2); }
  .col-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .col-title { font-family: var(--serif); font-weight: 500; font-size: 14px; color: var(--ink); display: flex; align-items: center; gap: 8px; }

  .col-body { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .empty { padding: 30px 12px; color: var(--ink-faint); font-style: italic; font-family: var(--serif); font-size: 13px; text-align: center; }
  .ev { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; display: flex; flex-direction: column; gap: 4px; transition: all 0.15s; position: relative; }

  .ev-time { font-family: var(--mono); font-size: 10px; color: var(--accent); letter-spacing: 0.05em; font-weight: 500; }
  .ev-time.allday { color: var(--ink-soft); font-style: italic; font-family: var(--serif); }
  .ev-title { font-size: 13px; color: var(--ink); font-weight: 500; line-height: 1.35; word-break: break-word; padding-right: 26px; }
  .ev-loc { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin-top: 1px; }
  .ev-action { position: absolute; top: 6px; right: 6px; width: 22px; height: 22px; border-radius: 4px; background: var(--bg-warm); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; opacity: 0.4; transition: all 0.15s; font-size: 13px; color: var(--ink-mid); }
  .ev-action:hover { background: var(--accent); color: white; border-color: var(--accent); opacity: 1; }
  .ev-action::after { content: '+'; line-height: 1; }

  .day-marker { font-family: var(--mono); font-size: 9px; letter-spacing: 0.2em; color: var(--ink-faint); padding: 8px 0 4px; text-transform: uppercase; border-top: 1px dashed var(--line); margin-top: 4px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 10px 11px 9px; transition: all 0.15s; display: flex; flex-direction: column; gap: 6px; cursor: grab; user-select: none; position: relative; }
  .card:active { cursor: grabbing; }

  .card.dragging { opacity: 0.4; transform: rotate(1deg); }

  .tag.pri-2 { background: var(--gold-bg); color: var(--p2-color); }

  .card-btn { width: 20px; height: 20px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: var(--ink-faint); transition: all 0.15s; line-height: 1; }
  .card-btn:hover { background: var(--bg-warm); color: var(--ink); }

  .col-add-btn { width: 100%; padding: 7px; border: 1px dashed var(--line-strong); border-radius: 5px; font-family: var(--mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.15s; }
  .col-add-btn:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }
  .col-body.drag-over { background: var(--bg-warm); }
  .modal-overlay { position: fixed; inset: 0; background: rgba(20,15,10,0.5); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 100; animation: fadein 0.2s; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  .modal { background: var(--surface); border-radius: 10px; max-width: 460px; width: 100%; padding: 28px 26px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); border: 1px solid var(--line); }
  .modal h2 { font-family: var(--serif); font-style: italic; font-weight: 400; font-size: 24px; margin-bottom: 6px; }
  .modal h2 .accent { color: var(--accent); }
  .modal p { color: var(--ink-mid); font-size: 13px; line-height: 1.6; margin-bottom: 14px; }
  .modal p code { font-family: var(--mono); background: var(--bg-warm); padding: 1px 5px; border-radius: 2px; font-size: 12px; color: var(--accent); }
  .modal label { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 6px; }

  .modal input[type=text]:focus, .modal input[type=password]:focus { border-color: var(--accent); }

  .modal-row { display: flex; gap: 10px; align-items: end; margin-bottom: 12px; }
  .modal-row > div { flex: 1; }
  .modal-row label { margin-bottom: 4px; }

  .modal-actions .primary { background: var(--ink); color: var(--bg); }

  .modal-actions .secondary { background: var(--bg-warm); color: var(--ink-mid); }

  .footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--ink-faint); letter-spacing: 0.1em; flex-wrap: wrap; gap: 8px; }

  .footer button:hover { color: var(--ink-mid); }
  .footer .left { display: flex; gap: 16px; align-items: center; }
  .stagger { opacity: 0; transform: translateY(4px); animation: stagger 0.5s ease-out forwards; }
  @keyframes stagger { to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div class="app">
  <header class="header stagger">
    <div class="header-left">
      <h1>지니의 <em>대시보드</em></h1>
      <div class="subtitle" id="subtitle">— · —</div>
    </div>
    <div class="header-right">
      <div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">전체</div></div>
      <div class="stat"><div class="num" id="stat-todo">0</div><div class="lbl">할일</div></div>
      <div class="stat"><div class="num" id="stat-doing">0</div><div class="lbl">진행</div></div>
      <div class="stat"><div class="num" id="stat-done">0</div><div class="lbl">완료</div></div>
      <div class="clock" id="clock">--:--</div>

  </header>
  <div class="toolbar stagger" style="animation-delay:0.05s;">
    <div class="tabs">
      <button class="tab active" data-tab="all">전체</button>

      <button class="tab" data-tab="personal">개인</button>
    </div>
    <div class="toolbar-divider"></div>
    <span class="filter-label">우선순위</span>
    <button class="filter-btn active" data-pri="all">전체</button>
    <button class="filter-btn" data-pri="1">P1</button>
    <button class="filter-btn" data-pri="2">P2</button>
    <button class="filter-btn" data-pri="3">P3</button>
    <div class="toolbar-spacer"></div>
    <span class="sync-pill" id="sync-pill"><span class="dot"></span><span class="lbl">SYNC</span></span>
  </div>
  <div class="board">
    <div class="col cal">
      <div class="col-header">
        <div class="col-title"><span class="icon"></span>캘린더</div>
        <div class="col-count" id="cal-count">—</div>
      </div>
      <div class="col-body" id="col-cal"></div>
    </div>
    <div class="col todo" data-status="todo">
      <div class="col-header">
        <div class="col-title"><span class="icon"></span>할 일</div>

    <div class="col doing" data-status="doing">

      <div class="col-header">
        <div class="col-title"><span class="icon"></span>완료</div>

      </div>

  <footer class="footer">
    <div class="left">

      <span id="cal-meta">—</span>

</div>
<div class="modal-overlay" id="token-modal" style="display:none;">
  <div class="modal">
    <h2>setup<span class="accent">.</span></h2>
    <p>대시보드를 처음 열었어요. GitHub 토큰을 입력하면 <strong>본인 브라우저에만</strong> 저장돼요. 서버 전송 없음.</p>
    <p style="font-size:11px; color:var(--ink-soft);">필요 권한: <code>gist</code> · <code>repo</code></p>

    <div class="err" id="token-err"></div>

      <button class="primary" id="token-save">저장</button>

</div>
<div class="modal-overlay" id="todo-modal" style="display:none;">
  <div class="modal">
    <h2 id="todo-modal-title">할 일 <span class="accent">추가</span></h2>

        <label>분류</label>

          <option value="">—</option>

      </div>
    </div>

      <button class="secondary" id="todo-cancel">취소</button>
      <button class="primary" id="todo-confirm">저장</button>
    </div>
  </div>
</div>
<script>
const STORAGE_KEY = { TOKEN: 'dash_gist_token', CALENDAR_GIST_ID: 'dash_calendar_gist_id', TAB: 'dash_active_tab', PRI_FILTER: 'dash_pri_filter' };
const CONFIG = window.CONFIG;
const KOREAN_DAYS = ['일','월','화','수','목','금','토'];
let state = { token: null, calendarGistId: null, todos: [], events: [], activeTab: 'all', priFilter: 'all', modalContext: null };

function todayKST() { const now = new Date(); return new Date(now.toLocaleString('en-US', { timeZone: 'Asia/Seoul' })); }
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmtDateKor(d) { return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 ${KOREAN_DAYS[d.getDay()]}요일`; }
function fmtTimeFromISO(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false }); }
function relativeDay(dateStr) {
  const today = todayKST(); const todayStr = isoDate(today);
  if (dateStr === todayStr) return '오늘';
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  if (dateStr === isoDate(tomorrow)) return '내일';
  const target = new Date(dateStr + 'T00:00:00');
  const diff = Math.round((target - today) / 86400000);
  return `+${diff}일 · ${KOREAN_DAYS[target.getDay()]}`;
}
function tickClock() { const d = todayKST(); document.getElementById('clock').textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function renderHeader() { document.getElementById('subtitle').textContent = `오늘 · ${fmtDateKor(todayKST())}`; }
function setSync(status, msg) {
  const el = document.getElementById('sync-pill');
  el.classList.remove('live','error');
  const labels = { idle: 'SYNC', syncing: 'SYNC…', live: 'LIVE', error: 'ERROR' };
  el.querySelector('.lbl').textContent = labels[status] || 'SYNC';
  if (status === 'live' || status === 'error') el.classList.add(status);
  document.getElementById('footer-status').textContent = (msg || labels[status]).toUpperCase();
}
function showTokenModal() { document.getElementById('token-modal').style.display = 'flex'; setTimeout(() => document.getElementById('token-input').focus(), 100); }
function hideTokenModal() { document.getElementById('token-modal').style.display = 'none'; document.getElementById('token-input').value = ''; document.getElementById('token-err').textContent = ''; }
async function saveToken() {
  const input = document.getElementById('token-input'); const errEl = document.getElementById('token-err');
  const token = input.value.trim();
  if (!token) { errEl.textContent = '토큰을 입력해주세요.'; return; }
  errEl.textContent = '검증 중…';
  try {
    const r = await fetch('https://api.github.com/user', { headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) { errEl.textContent = '토큰 검증 실패 (' + r.status + ').'; return; }
    localStorage.setItem(STORAGE_KEY.TOKEN, token);
    state.token = token; hideTokenModal(); await bootstrap();
  } catch (e) { errEl.textContent = '네트워크 오류: ' + e.message; }
}
function resetToken() {
  if (!confirm('토큰을 삭제하고 다시 입력하시겠습니까?')) return;
  localStorage.removeItem(STORAGE_KEY.TOKEN); localStorage.removeItem(STORAGE_KEY.CALENDAR_GIST_ID);
  state.token = null; state.calendarGistId = null; showTokenModal();
}
async function discoverCalendarGist() {
  const cached = localStorage.getItem(STORAGE_KEY.CALENDAR_GIST_ID);
  if (cached) { state.calendarGistId = cached; return; }
  if (CONFIG.CALENDAR_GIST_ID) { state.calendarGistId = CONFIG.CALENDAR_GIST_ID; return; }
  const r = await fetch('https://api.github.com/gists?per_page=100', { headers: { 'Authorization': `token ${state.token}`, 'Accept': 'application/vnd.github+json' } });
  if (!r.ok) throw new Error('gist list failed: ' + r.status);
  const gists = await r.json();
  const found = gists.find(g => g.files && g.files['calendar.json']);
  if (!found) throw new Error('calendar.json gist not found');
  state.calendarGistId = found.id;
  localStorage.setItem(STORAGE_KEY.CALENDAR_GIST_ID, found.id);
}
async function loadCalendar() {
  setSync('syncing', '캘린더 로드 중');
  try {
    if (!state.calendarGistId) await discoverCalendarGist();
    const r = await fetch(`https://api.github.com/gists/${state.calendarGistId}`, { headers: { 'Authorization': `token ${state.token}`, 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('gist load failed: ' + r.status);
    const data = await r.json();
    const file = data.files && data.files['calendar.json'];
    let payload = { events: [] };
    if (file && file.content) try { payload = JSON.parse(file.content); } catch {}
    state.events = payload.events || [];
    const updatedAt = payload.updated_at ? new Date(payload.updated_at) : null;
    const ageMin = updatedAt ? (Date.now() - updatedAt.getTime()) / 60000 : 999;
    const ageStr = ageMin < 60 ? `${Math.round(ageMin)}분 전` : `${(ageMin/60).toFixed(1)}시간 전`;
    document.getElementById('cal-meta').textContent = `CAL ${ageStr.toUpperCase()}`;
    setSync('live', `synced ${ageStr}`); renderCalendar();
  } catch (e) {
    setSync('error', e.message); document.getElementById('cal-meta').textContent = 'CAL ERR'; renderCalendar();
  }
}
async function loadTodos() {
  try {
    const r = await fetch(`https://api.github.com/gists/${CONFIG.TODOS_GIST_ID}`, { headers: { 'Authorization': `token ${state.token}`, 'Accept': 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('todos load: ' + r.status);
    const data = await r.json();
    const file = data.files && data.files['todos.json'];
    let parsed = [];
    if (file && file.content) try { parsed = JSON.parse(file.content); } catch {}
    if (!Array.isArray(parsed)) parsed = [];
    parsed = parsed.map(t => ({
      id: t.id || (Date.now().toString(36) + Math.random().toString(36).slice(2,6)),
      text: t.text || '', category: t.category || 'work', priority: t.priority || null,
      time: t.time || null, status: t.status || (t.done ? 'done' : 'todo'),
      fromCalendar: t.fromCalendar || false, created: t.created || Date.now(), ...t,
    }));
    state.todos = parsed; renderBoard();
  } catch (e) { console.error(e); }
}
let saveTimer = null;
function scheduleSave() { if (saveTimer) clearTimeout(saveTimer); saveTimer = setTimeout(saveTodos, 600); }
async function saveTodos() {
  try {
    const r = await fetch(`https://api.github.com/gists/${CONFIG.TODOS_GIST_ID}`, {
      method: 'PATCH',
      headers: { 'Authorization': `token ${state.token}`, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'todos.json': { content: JSON.stringify(state.todos, null, 2) } } }),
    });
    if (!r.ok) throw new Error('save: ' + r.status);
  } catch (e) { console.error(e); setSync('error', '저장 실패'); }
}
function renderCalendar() {
  const container = document.getElementById('col-cal');
  const today = isoDate(todayKST());
  const events = state.events.slice(0, 30);
  document.getElementById('cal-count').textContent = events.length;
  if (events.length === 0) { container.innerHTML = '<div class="empty">예정된 일정 없음</div>'; return; }
  let html = ''; let curDate = '';
  for (const ev of events) {
    if (ev.date !== curDate) {
      curDate = ev.date;
      const isToday = ev.date === today;
      html += `<div class="day-marker${isToday ? ' today' : ''}">${relativeDay(ev.date)}</div>`;
    }
    let time;
    if (ev.all_day) { time = '<div class="ev-time allday">종일</div>'; }
    else {
      const s = fmtTimeFromISO(ev.start); const e = ev.end ? fmtTimeFromISO(ev.end) : '';
      time = `<div class="ev-time">${s}${e ? ` → ${e}` : ''}</div>`;
    }
    const loc = ev.location ? `<div class="ev-loc">${escapeHTML(ev.location)}</div>` : '';
    html += `<div class="ev" data-event='${encodeURIComponent(JSON.stringify(ev))}'>${time}<div class="ev-title">${escapeHTML(ev.summary || '(제목 없음)')}</div>${loc}<button class="ev-action" title="할일로 추가" data-action="ev-to-todo"></button></div>`;
  }
  container.innerHTML = html;
}
document.getElementById('col-cal').addEventListener('click', e => {
  const btn = e.target.closest('[data-action="ev-to-todo"]');
  if (!btn) return;
  const evWrap = btn.closest('.ev'); if (!evWrap) return;
  try {
    const evData = JSON.parse(decodeURIComponent(evWrap.dataset.event));
    let timeStr = '';
    if (!evData.all_day && evData.start) {
      timeStr = new Date(evData.start).toLocaleTimeString('ko-KR', { timeZone: 'Asia/Seoul', hour: '2-digit', minute: '2-digit', hour12: false });
    }
    openTodoModal({ mode: 'add-from-calendar', preset: { text: evData.summary || '', time: timeStr, category: 'work', priority: '', fromCalendar: true } });
  } catch (err) { console.error(err); }
});
function filterTodos() {
  return state.todos.filter(t => {
    if (state.activeTab !== 'all' && t.category !== state.activeTab) return false;
    if (state.priFilter !== 'all' && String(t.priority) !== state.priFilter) return false;
    return true;
  });
}
function renderBoard() {
  const filtered = filterTodos();
  const buckets = { todo: [], doing: [], done: [] };
  for (const t of filtered) { const s = t.status || 'todo'; if (buckets[s]) buckets[s].push(t); }
  const sorter = (a,b) => {
    const pa = a.priority || 99, pb = b.priority || 99;
    if (pa !== pb) return pa - pb;
    if (a.time && b.time) return a.time.localeCompare(b.time);
    if (a.time) return -1; if (b.time) return 1;
    return (a.created || 0) - (b.created || 0);
  };
  buckets.todo.sort(sorter); buckets.doing.sort(sorter);
  buckets.done.sort((a,b) => (b.completedAt||0) - (a.completedAt||0));
  for (const status of ['todo','doing','done']) {
    const el = document.getElementById('col-' + status);
    document.getElementById('cnt-' + status).textContent = buckets[status].length;
    if (buckets[status].length === 0) { el.innerHTML = '<div class="empty">비어있음</div>'; }
    else { el.innerHTML = buckets[status].map(cardHTML).join(''); }
  }
  const inTab = t => state.activeTab === 'all' || t.category === state.activeTab;
  document.getElementById('stat-total').textContent = state.todos.filter(inTab).length;
  document.getElementById('stat-todo').textContent = state.todos.filter(t => (t.status||'todo')==='todo' && inTab(t)).length;
  document.getElementById('stat-doing').textContent = state.todos.filter(t => t.status==='doing' && inTab(t)).length;
  document.getElementById('stat-done').textContent = state.todos.filter(t => t.status==='done' && inTab(t)).length;
}
function cardHTML(t) {
  const cat = { work: '회사', personal: '개인' }[t.category] || '회사';
  const meta = [];
  meta.push(`<span class="tag cat-${t.category}">${cat}</span>`);
  if (t.priority) meta.push(`<span class="tag pri-${t.priority}">P${t.priority}</span>`);
  if (t.time) meta.push(`<span class="tag time">${escapeHTML(t.time)}</span>`);
  if (t.fromCalendar) meta.push(`<span class="tag from-cal">캘린더</span>`);
  return `<div class="card${t.status==='done'?' done':''}" draggable="true" data-id="${t.id}"><div class="card-text">${escapeHTML(t.text)}</div><div class="card-meta">${meta.join('')}</div><div class="card-actions"><button class="card-btn del" data-action="delete" title="삭제">×</button></div></div>`;
}
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
let draggedId = null;
document.addEventListener('dragstart', e => {
  const card = e.target.closest('.card'); if (!card) return;
  draggedId = card.dataset.id; card.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move';
});
document.addEventListener('dragend', e => {
  const card = e.target.closest('.card'); if (card) card.classList.remove('dragging');
  document.querySelectorAll('.col-body.drag-over').forEach(el => el.classList.remove('drag-over'));
  draggedId = null;
});
document.querySelectorAll('[data-drop]').forEach(zone => {
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
  zone.addEventListener('dragleave', e => { if (!zone.contains(e.relatedTarget)) zone.classList.remove('drag-over'); });
  zone.addEventListener('drop', e => {
    e.preventDefault(); zone.classList.remove('drag-over');
    if (!draggedId) return;
    const newStatus = zone.dataset.drop;
    const todo = state.todos.find(t => t.id === draggedId);
    if (!todo || todo.status === newStatus) return;
    todo.status = newStatus;
    if (newStatus === 'done') todo.completedAt = Date.now();
    renderBoard(); scheduleSave();
  });
});
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-action="delete"]'); if (!btn) return;
  const card = btn.closest('.card'); if (!card) return;
  const id = card.dataset.id;
  if (!confirm('이 항목을 삭제할까요?')) return;
  state.todos = state.todos.filter(t => t.id !== id);
  renderBoard(); scheduleSave();
});
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.activeTab = btn.dataset.tab;
    localStorage.setItem(STORAGE_KEY.TAB, state.activeTab);
    renderBoard();
  });
});
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.priFilter = btn.dataset.pri;
    localStorage.setItem(STORAGE_KEY.PRI_FILTER, state.priFilter);
    renderBoard();
  });
});
function openTodoModal(ctx) {
  state.modalContext = ctx;
  const isFromCal = ctx.mode === 'add-from-calendar';
  document.getElementById('todo-modal-title').innerHTML = isFromCal ? '캘린더 → <span class="accent">할 일</span>' : `${ctx.statusLabel || '할 일'} <span class="accent">추가</span>`;
  const preset = ctx.preset || {};
  document.getElementById('todo-text').value = preset.text || '';
  document.getElementById('todo-cat').value = preset.category || (state.activeTab !== 'all' ? state.activeTab : 'work');
  document.getElementById('todo-pri').value = preset.priority || '';
  document.getElementById('todo-time').value = preset.time || '';
  document.getElementById('todo-modal').style.display = 'flex';
  setTimeout(() => document.getElementById('todo-text').focus(), 50);
}
function closeTodoModal() { document.getElementById('todo-modal').style.display = 'none'; state.modalContext = null; }
function confirmTodoModal() {
  const text = document.getElementById('todo-text').value.trim();
  if (!text) { document.getElementById('todo-text').focus(); return; }
  const ctx = state.modalContext || {};
  const todo = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    text,
    category: document.getElementById('todo-cat').value,
    priority: parseInt(document.getElementById('todo-pri').value) || null,
    time: document.getElementById('todo-time').value || null,
    status: ctx.targetStatus || 'todo',
    fromCalendar: !!(ctx.preset && ctx.preset.fromCalendar),
    created: Date.now(),
  };
  state.todos.push(todo);
  closeTodoModal(); renderBoard(); scheduleSave();
}
document.querySelectorAll('[data-add]').forEach(btn => {
  btn.addEventListener('click', () => {
    const status = btn.dataset.add;
    const labels = { todo: '할 일', doing: '진행중' };
    openTodoModal({ mode: 'add', targetStatus: status, statusLabel: labels[status] });
  });
});
document.getElementById('todo-cancel').addEventListener('click', closeTodoModal);
document.getElementById('todo-confirm').addEventListener('click', confirmTodoModal);
document.getElementById('todo-text').addEventListener('keydown', e => { if (e.key === 'Enter') confirmTodoModal(); if (e.key === 'Escape') closeTodoModal(); });
document.getElementById('reset-btn').addEventListener('click', resetToken);
document.getElementById('token-save').addEventListener('click', saveToken);
document.getElementById('token-input').addEventListener('keydown', e => { if (e.key === 'Enter') saveToken(); });
async function bootstrap() {
  renderHeader(); tickClock(); setInterval(tickClock, 30000);
  state.token = localStorage.getItem(STORAGE_KEY.TOKEN);
  state.calendarGistId = localStorage.getItem(STORAGE_KEY.CALENDAR_GIST_ID);
  state.activeTab = localStorage.getItem(STORAGE_KEY.TAB) || 'all';
  state.priFilter = localStorage.getItem(STORAGE_KEY.PRI_FILTER) || 'all';
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === state.activeTab));
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.pri === state.priFilter));
  if (!state.token) { showTokenModal(); return; }
  await Promise.all([loadCalendar(), loadTodos()]);
  setInterval(() => { if (!document.hidden) loadCalendar(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) loadCalendar(); });
}
bootstrap();
</script>
